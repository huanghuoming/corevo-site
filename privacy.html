<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Privacy Policy | CoRevo Inc.</title>
  <meta name="robots" content="index,follow" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <script defer src="assets/js/main.js"></script>
</head>
<body>
<header class="header">
  <div class="container nav">
    <a class="brand" href="index.html">
      <img src="assets/img/logo.png" alt="CoRevo">
      <div>
        <div class="name">CoRevo</div>
        <div class="sub">CoRevo Inc.</div>
      </div>
    </a>
    <div class="actions">
      <a class="btn" href="contact.html" data-i18n="footer_links_contact">Contact</a>
    </div>
  </div>
</header>

<main>
  <section class="section">
    <div class="container">
      <h1 id="pp-title">個人情報保護方針</h1>
      <div class="card" style="margin-top:16px">
        <div class="content" id="pp-content" style="padding:20px">
          <p>株式会社CoRevo（以下「当社」）は、お問い合わせフォーム等で取得する個人情報を、以下の目的で利用します。</p>
          <p>1. お問い合わせへの回答および必要な連絡</p>
          <p>2. サービス案内・提案・改善のための分析</p>
          <p>3. 法令に基づく対応</p>
          <p>当社は、法令に基づく場合を除き、ご本人の同意なく第三者へ個人情報を提供しません。</p>
          <p>開示・訂正・削除等のご希望は、当社窓口までご連絡ください。</p>
          <p style="margin-top:14px"><a href="contact.html" style="text-decoration:underline" id="pp-back">お問い合わせページへ戻る</a></p>
        </div>
      </div>
    </div>
  </section>
</main>

<script>
(function(){
  const PP = {
    ja: {
      title: "個人情報保護方針",
      html: "<p>株式会社CoRevo（以下「当社」）は、お問い合わせフォーム等で取得する個人情報を、以下の目的で利用します。</p><p>1. お問い合わせへの回答および必要な連絡</p><p>2. サービス案内・提案・改善のための分析</p><p>3. 法令に基づく対応</p><p>当社は、法令に基づく場合を除き、ご本人の同意なく第三者へ個人情報を提供しません。</p><p>開示・訂正・削除等のご希望は、当社窓口までご連絡ください。</p>",
      back: "お問い合わせページへ戻る"
    },
    en: {
      title: "Privacy Policy",
      html: "<p>CoRevo Inc. (\"we\") uses personal information collected through contact forms for the following purposes.</p><p>1. Responding to inquiries and necessary communications</p><p>2. Service guidance, proposals, and quality improvement analysis</p><p>3. Legal and regulatory compliance</p><p>We do not provide personal data to third parties without consent, except as required by law.</p><p>Please contact us for requests related to access, correction, or deletion.</p>",
      back: "Back to contact page"
    },
    zh: {
      title: "隐私政策",
      html: "<p>CoRevo 株式会社（以下简称“本公司”）会将通过联系表单获取的个人信息用于以下目的。</p><p>1. 回复咨询与必要联络</p><p>2. 服务提案、改进与分析</p><p>3. 法律法规要求的处理</p><p>除法律规定外，未经本人同意，本公司不会向第三方提供个人信息。</p><p>如需查询、更正、删除个人信息，请联系本公司。</p>",
      back: "返回联系页面"
    },
    ko: {
      title: "개인정보 처리방침",
      html: "<p>CoRevo Inc.는 문의 양식 등을 통해 수집한 개인정보를 다음 목적에 사용합니다.</p><p>1. 문의 응답 및 필요한 연락</p><p>2. 서비스 안내, 제안 및 개선 분석</p><p>3. 법령 준수 대응</p><p>법령에 따른 경우를 제외하고, 본인 동의 없이 개인정보를 제3자에게 제공하지 않습니다.</p><p>열람, 정정, 삭제 요청은 당사로 연락해 주시기 바랍니다.</p>",
      back: "문의 페이지로 돌아가기"
    }
  };

  function applyPrivacyLang(){
    const lang = document.documentElement.getAttribute("lang") || "ja";
    const t = PP[lang] || PP.ja;
    document.getElementById("pp-title").textContent = t.title;
    document.getElementById("pp-content").innerHTML = t.html + '<p style="margin-top:14px"><a href="contact.html" style="text-decoration:underline" id="pp-back">' + t.back + '</a></p>';
  }

  document.addEventListener("DOMContentLoaded", function(){
    applyPrivacyLang();
    const mo = new MutationObserver(applyPrivacyLang);
    mo.observe(document.documentElement, { attributes: true, attributeFilter: ["lang"] });
  });
})();
</script>
</body>
</html>
